name = "sitemap-builder"
main = "worker.js"
compatibility_date = "2025-01-01"

# Bundle the PNGs (OG share image, favicon, touch icon) as ArrayBuffers the
# Worker serves itself: no external host, CSP-safe.
rules = [
  { type = "Data", globs = ["**/*.png"], fallthrough = false },
  # The AI engines' logos in the call to action, copied from geo-toolkit/logos.
  { type = "Text", globs = ["**/*.svg"], fallthrough = false }
]

# No nodejs_compat / npm install needed: the Worker reuses ../src/crawler.js,
# ../src/robots.js and ../src/sitemap.js, which use only the platform fetch.
#
# ⚠️ Deploy to your PERSONAL / GeoSuite Cloudflare account — NOT the work/Cato
# one (`wrangler whoami` to check). Pin it to be safe:
# account_id = "<your-personal-cloudflare-account-id>"
